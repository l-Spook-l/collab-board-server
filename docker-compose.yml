services:
  db:
    image: postgres:16-alpine
    container_name: collab_board_db
    restart: "no"
    ports:
      - "5433:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mynetwork

  app:
    build:
      context: .
    container_name: collab_board_app
    restart: always
    command: ["/app/scripts/app_run.sh"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    networks:
      - mynetwork
    depends_on:
      db:
        condition: service_healthy


volumes:
  pgdata:


networks:
  mynetwork:
    driver: bridge
