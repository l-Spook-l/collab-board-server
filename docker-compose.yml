  app:
    build:
      context: .
    container_name: collab_board_app
    restart: always
    command: ["/app/scripts/app_run.sh"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    networks:
      - mynetwork
    depends_on:
      db:
        condition: service_healthy
      # redis:
